name: Anderson manual production release approval
# DRAFT: Requires review/merge to main AND GitHub Settings > Environments
# with required reviewers for "staging" and "production".
# This deliberately DOES NOT deploy or promote any Vercel build.
on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: "Exact reviewed main commit SHA (40 characters)"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: anderson-manual-production-approval
  cancel-in-progress: false
jobs:
  verify-staging:
    name: Authenticated staging household acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: staging
    steps:
      - name: Check reviewed commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.release_commit }}
        run: |
          if ! [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Provide a full reviewed 40-character SHA"
            exit 1
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_commit }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Static tests and production build
        run: |
          npm test
          npm run build
          npm audit --audit-level=high
      - name: Parent A / Child A / Parent B real staging permissions
        run: node tests/routine-staging-acceptance.mjs
        env:
          E2E_STAGING_PROJECT_REF: ${{ secrets.E2E_STAGING_PROJECT_REF }}
          E2E_STAGING_SUPABASE_URL: ${{ secrets.E2E_STAGING_SUPABASE_URL }}
          E2E_STAGING_SUPABASE_KEY: ${{ secrets.E2E_STAGING_SUPABASE_KEY }}
          E2E_PARENT_A_EMAIL: ${{ secrets.E2E_PARENT_A_EMAIL }}
          E2E_PARENT_A_PASSWORD: ${{ secrets.E2E_PARENT_A_PASSWORD }}
          E2E_PARENT_A_PIN: ${{ secrets.E2E_PARENT_A_PIN }}
          E2E_CHILD_A_EMAIL: ${{ secrets.E2E_CHILD_A_EMAIL }}
          E2E_CHILD_A_PASSWORD: ${{ secrets.E2E_CHILD_A_PASSWORD }}
          E2E_PARENT_B_EMAIL: ${{ secrets.E2E_PARENT_B_EMAIL }}
          E2E_PARENT_B_PASSWORD: ${{ secrets.E2E_PARENT_B_PASSWORD }}
  require-release-approval:
    name: Protected production approval (no deployment)
    runs-on: ubuntu-24.04
    needs: verify-staging
    timeout-minutes: 10
    environment: production
    steps:
      - name: Record manual approval completion
        env:
          COMMIT_SHA: ${{ inputs.release_commit }}
        run: |
          echo "Staging acceptance and the protected production review completed for $COMMIT_SHA"
          echo "No production deployment or database/Cron migration has been performed."
          echo "An authorized operator must separately perform a controlled Vercel release."
