name: Isolated security hardening verification
on:
  push:
    branches:
      - "security/pentest-hardening-*"
permissions:
  contents: read
jobs:
  security-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Unit and security contract tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Known high-severity supply chain advisories
        run: npm audit --audit-level=high
      - name: Install browser harness
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Serve demo (no real family accounts)
        run: |
          npm run preview -- --host 127.0.0.1 --port 4174 > /tmp/calendar-preview.log 2>&1 &
          for i in {1..60}; do
            curl -sf http://127.0.0.1:4174/demo >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/calendar-preview.log
          exit 1
      - name: Four viewport regression
        run: node tests/browser-smoke.mjs
