name: Anderson Family Calendar release audit
on:
  push:
    branches: [audit/release-readiness-20261112]
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "package*.json"
      - ".github/workflows/release-audit.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Unit and integration tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Dependency vulnerabilities
        run: npm audit --audit-level=high
      - name: Security regression checks
        if: success() || failure()
        run: |
          if grep -Eq "pin[[:space:]]*===[[:space:]]*['\"]1234['\"]" src/CalendarApp.jsx; then
            echo "::error::Hard-coded Parent Portal PIN is forbidden."
            exit 1
          fi
