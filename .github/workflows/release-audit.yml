name: Anderson Family Calendar release audit
on:
  push:
    branches: [main, fix/security-ci-photos-kiosk-20261112]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Unit and integration tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Dependency vulnerabilities
        run: npm audit --audit-level=high
      - name: Security regression checks
        if: success() || failure()
        run: |
          if [ -e src/CalendarApp.jsx ]; then
            echo "::error::Unused prototype CalendarApp.jsx must not be reintroduced."
            exit 1
          fi
          if grep -ERq "pin[[:space:]]*===[[:space:]]*['\\\"][0-9]{4}['\\\"]" src/; then
            echo "::error::Static client-side Parent PIN detected."
            exit 1
          fi
