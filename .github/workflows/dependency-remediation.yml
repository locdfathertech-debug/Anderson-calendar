name: Dependency remediation evaluation
on:
  push:
    branches: [fix/security-ci-photos-kiosk-20261112]
permissions:
  contents: read
jobs:
  upgrade-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Evaluate npm security upgrades (never push automatically)
        run: npm audit fix --force
      - name: Test upgraded dependencies
        run: npm test
      - name: Build upgraded dependencies
        run: npm run build
      - name: Verify remaining advisories
        run: npm audit --audit-level=high
      - name: Upload updated package manifest and lockfile for human review
        if: success() || failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-lockfile-candidate
          path: |
            package.json
            package-lock.json
          retention-days: 7
