name: Dependency remediation evaluation
on:
  push:
    branches: [fix/security-ci-photos-kiosk-20261112]
  pull_request:
permissions:
  contents: write
jobs:
  upgrade-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Evaluate targeted, compatible security upgrades (never push automatically)
        run: |
          npm uninstall react-router-dom
          npm install --save-dev --save-exact vite@7.3.8
          npm audit fix --audit-level=moderate
      - name: Test upgraded dependencies
        run: npm test
      - name: Build upgraded dependencies
        run: npm run build
      - name: Verify remaining advisories
        run: npm audit --audit-level=moderate
      - name: Upload updated package manifest and lockfile for human review
        if: success() || failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-lockfile-candidate
          path: |
            package.json
            package-lock.json
          retention-days: 7

      - name: Commit tested lockfile to the review branch only
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/security-ci-photos-kiosk-20261112'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "fix(deps): remove unused router and update Vite security patches"
          gh auth setup-git
          git push origin HEAD:refs/heads/fix/security-ci-photos-kiosk-20261112
